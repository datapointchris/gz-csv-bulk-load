[project]
name = "gz-csv-bulk-load"
version = "0.1.0"
description = "Load large gzipped CSV drops into Parquet, one Glue run per table, fanned out by Step Functions."
requires-python = ">=3.11"          # Glue 5.0 ships Python 3.11; a higher floor cannot run there

# Nothing at runtime. boto3 is in both the Lambda and the Glue runtime, pyspark
# and awsglue are in Glue. A dependency here would have to be packaged into both.
dependencies = []

[project.optional-dependencies]
dev = [
    "pyspark==3.5.4",               # matches Glue 5.0 exactly
    "boto3>=1.34",
    "pytest>=8.0",
    "ruff",
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
known-first-party = ["schemas", "load_table", "check_headers"]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "8.0"
verbosity_assertions = 2

[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true

[tool.codespell]
check-filenames = true

[tool.forge]
# Keys the shared toolchain standard owns, written by its generator.
# Dropping one from the template removes it here on the next sync; a key absent
# from this list belongs to the project and is never touched. Do not hand-edit.
managed = [
    ["ruff", "line-length"],
    ["ruff", "format", "quote-style"],
    ["ruff", "format", "indent-style"],
    ["ruff", "format", "skip-magic-trailing-comma"],
    ["ruff", "format", "line-ending"],
    ["ruff", "format", "docstring-code-format"],
    ["ruff", "lint", "select"],
    ["ruff", "lint", "ignore"],
    ["ruff", "lint", "isort", "force-single-line"],
    ["ruff", "lint", "per-file-ignores", "__init__.py"],
    ["mypy", "pretty"],
    ["mypy", "ignore_missing_imports"],
    ["mypy", "check_untyped_defs"],
    ["mypy", "warn_return_any"],
    ["pyright", "typeCheckingMode"],
    ["pyright", "analyzeUnannotatedFunctions"],
    ["codespell", "check-filenames"],
    ["pytest", "ini_options", "verbosity_assertions"],
    ["pytest", "ini_options", "minversion"],
    ["pytest", "ini_options", "testpaths"],
]
